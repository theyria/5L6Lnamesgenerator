<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Générateur 5L</title>
<style>
:root{--bg:#f4f3ff;--card:#fff;--text:#1b1b2f;--muted:#6b6b8a;--line:#e3e1f5;--accent:#6c4cff;--accent2:#00c2a8;--code:#f0eefc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d1a;--card:#171629;--text:#ecebff;--muted:#9a98c0;--line:#2a2847;--accent:#8b72ff;--accent2:#2ee6c5;--code:#0f0e1f}}
:root[data-theme="dark"]{--bg:#0e0d1a;--card:#171629;--text:#ecebff;--muted:#9a98c0;--line:#2a2847;--accent:#8b72ff;--accent2:#2ee6c5;--code:#0f0e1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:640px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 30px color-mix(in srgb,var(--accent) 14%,transparent)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=number],input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--code);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.chip{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--code);font-size:14px}
.chip input{accent-color:var(--accent);width:16px;height:16px}
.chip small{display:block;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;transition:transform .1s,opacity .2s}
button:active{transform:scale(.97)}
.primary{flex:1;color:var(--onacc,#fff);background:linear-gradient(90deg,var(--accent),var(--accent3,#a24cff))}
.ghost{background:var(--code);color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--code);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
pre,.pre{margin:0;background:var(--code);border-radius:12px;padding:14px;font:14px/1.7 ui-monospace,Menlo,Consolas,monospace;max-height:260px;overflow:auto;min-height:60px}
.empty{color:var(--muted)}
.toast{min-height:20px;margin-top:10px;font-size:13px;color:var(--accent2)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
.pill:hover{border-color:var(--accent)}
select{font:inherit;font-size:14px;font-weight:600;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
select:focus{outline:2px solid var(--accent)}
.links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
body{background-image:var(--bgimg,none);background-attachment:fixed}
#len,#fmt{width:100%;border-radius:10px;padding:11px 12px;font-size:16px;background:var(--code)}
.mailwrap{position:relative}
.mailmenu{position:absolute;top:100%;left:0;padding-top:6px;display:none;flex-direction:column;gap:6px;min-width:150px;z-index:15}
.mailwrap:hover .mailmenu,.mailwrap:focus-within .mailmenu{display:flex}
.card,.pill,select,.opt{transition:background .3s,border-color .3s,color .3s}
button.pill{cursor:pointer;padding:9px 14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--card);color:var(--text);border-left:1px solid var(--line);transform:translateX(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.drawer.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 6px;font-size:20px}
.x{background:var(--code);color:var(--text);border:1px solid var(--line);padding:6px 10px;border-radius:10px}
#themeList{overflow:auto;padding:0 14px 24px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 4px 8px;font-weight:700}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;border-radius:12px;background:var(--code);color:var(--text);border:1px solid var(--line)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw{width:34px;height:34px;border-radius:10px;border:1px solid rgba(128,128,128,.4);display:grid;place-items:center;flex:none}
.sw i{width:18px;height:18px;border-radius:50%}
select{font-size:18px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 4px}
.ln{display:flex;align-items:center;gap:8px;padding:2px 6px;border-radius:8px}
.ln:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ln span{flex:1;cursor:pointer}
.ln button{background:none;color:var(--muted);padding:2px 8px;font-size:16px;border-radius:8px}
.ln button.on{color:var(--accent)}
.bar{height:6px;border-radius:99px;background:var(--code);overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent3,var(--accent2)))}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;cursor:pointer}
#tq{flex:1;min-width:0}
.opt{text-align:start}
[dir=rtl] .mailmenu{left:auto;right:0}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--line);padding:11px}
.tab.on{color:var(--onacc,#fff);background:linear-gradient(90deg,var(--accent),var(--accent3,var(--accent2)));border-color:transparent}
.acc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--code)}
.acc .f{display:flex;align-items:center;gap:8px;margin:4px 0}
.acc .f small{width:96px;color:var(--muted);flex:none}
.acc .f span{flex:1;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.mini{background:none;border:1px solid var(--line);color:var(--text);padding:4px 8px;border-radius:8px;font-size:14px}
.del{color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="links">
      <a id="psn" class="pill" href="https://amethxst.dev/psn-availability" target="_blank" rel="noopener noreferrer">Disponibilité PSN ↗</a>
      <div class="mailwrap">
        <button id="mail" class="pill" type="button">Créer un e-mail ▾</button>
        <div class="mailmenu">
          <a class="pill" href="https://workspace.google.com/intl/us/gmail/" target="_blank" rel="noopener noreferrer">Gmail ↗</a>
          <a class="pill" href="https://www.microsoft.com/en-us/microsoft-365/outlook/email-and-calendar-software-microsoft-outlook" target="_blank" rel="noopener noreferrer">Outlook ↗</a>
        </div>
      </div>
      <a id="psnc" class="pill" href="https://www.playstation.com/en-us/" target="_blank" rel="noopener noreferrer">Créer un compte PSN ↗</a>
    </div>
    <div class="links"><button id="themeBtn" class="pill" type="button">🎨 Thèmes</button><select id="lang" aria-label="Langue">
      <option value="fr">🇫🇷</option>
      <option value="en">🇬🇧</option>
      <option value="es">🇪🇸</option>
      <option value="de">🇩🇪</option>
      <option value="it">🇮🇹</option>
      <option value="ja">🇯🇵</option>
      <option value="ko">🇰🇷</option>
      <option value="ru">🇷🇺</option>
      <option value="pl">🇵🇱</option>
      <option value="uk">🇺🇦</option>
      <option value="pt">🇧🇷</option>
      <option value="ar">🇸🇦</option>
    </select></div>
  </div>
  <h1 id="titre">Générateur <span>5L ou 6L</span></h1>
  <p class="sub" id="sub">Génère des 5L ou 6L pour tes comptes PSN ! Copie-les depuis ton navigateur ou télécharge-les en .txt.</p>
  <div class="tabs" role="tablist"><button class="tab on" id="tbGen" type="button" role="tab" aria-selected="true">Générateur</button><button class="tab" id="tbAcc" type="button" role="tab" aria-selected="false">Comptes</button></div>
  <div id="tabGen">

  <div class="card">
    <div class="row">
      <div><label for="nb">Nombre de lignes</label><input id="nb" type="number" min="1" max="1000000" value="100"></div>
      <div><label for="len">Caractères par ligne</label><select id="len"><option value="5">5L</option><option value="6">6L</option></select></div>
    </div>
    <div class="row" style="margin-top:12px;grid-template-columns:2fr 1fr"><div><label for="nom">Nom du fichier</label><input id="nom" type="text" value="names.txt"></div><div><label for="fmt">Format</label><select id="fmt"><option value="txt">.txt</option><option value="csv">.csv</option><option value="json">.json</option></select></div></div>
    <div class="row" style="margin-top:12px"><div><label for="first">Premières lettres (facultatif)</label><input id="first" type="text" maxlength="6" autocomplete="off"></div><div><label for="last">Dernières lettres / chiffres (facultatif)</label><input id="last" type="text" maxlength="6" autocomplete="off"></div></div>
    <div class="types" id="types">
      <label class="chip"><input type="checkbox" value="majuscule" checked><div>Majuscule<small>Abcde</small></div></label>
      <label class="chip"><input type="checkbox" value="chiffre" checked><div>Chiffre<small>a1bcd</small></div></label>
      <label class="chip"><input type="checkbox" value="tiret" checked><div>Tiret<small>a-bcd</small></div></label>
      <label class="chip"><input type="checkbox" value="normal" checked><div>Normal<small>abcde</small></div></label>
    </div>
    <label class="chk"><input type="checkbox" id="nodup" style="accent-color:var(--accent);width:16px;height:16px"><span id="nodupT">Sans doublons</span></label>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="sLignes">0</b><span>lignes</span></div>
      <div class="stat"><b id="sTaille">0 Ko</b><span>taille</span></div>
    </div>
    <div id="apercu" class="pre"><span class="empty">Aperçu : clique sur « Générer ».</span></div>
    <div class="btns" style="margin-top:14px">
      <button class="primary" id="gen">Générer</button>
      <button class="ghost" id="dl" disabled>Télécharger</button>
      <button class="ghost" id="cp" disabled>Copier</button>
    </div>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="card"><div class="fh"><b id="favT">Favoris</b><div class="links"><button class="ghost" id="favExp" type="button" style="padding:8px 12px">Exporter</button><button class="ghost" id="favImp" type="button" style="padding:8px 12px">Importer</button><button class="ghost" id="favCp" type="button" style="padding:8px 12px">Copier tout</button><button class="ghost" id="favClr" type="button" style="padding:8px 12px">Vider</button></div></div><div id="favs" class="pre"></div><div class="empty" id="favNote" style="font-size:12px;margin-top:8px"></div><input type="file" id="favFile" accept=".txt,text/plain" hidden></div>
  </div>
  <div id="tabAcc" hidden>
    <div class="card">
      <div class="row">
        <div><label for="ap">Pseudo PSN</label><input id="ap" type="text" autocomplete="off"></div>
        <div><label for="ae">E-mail</label><input id="ae" type="text" inputmode="email" autocomplete="off"></div>
      </div>
      <div style="margin-top:12px"><label for="aw">Mot de passe</label><div style="display:flex;gap:8px"><input id="aw" type="password" autocomplete="new-password"><button class="ghost" id="awEye" type="button" style="padding:8px 12px">👁</button></div></div>
      <div class="btns" style="margin-top:14px"><button class="primary" id="accAdd" type="button">Enregistrer le compte</button></div>
      <p class="empty" id="accWarn" style="font-size:12px;margin:12px 0 0"></p>
    </div>
    <div class="card">
      <div class="fh"><span></span><div class="links"><button class="ghost" id="accExp" type="button" style="padding:8px 12px">Exporter</button><button class="ghost" id="accImp" type="button" style="padding:8px 12px">Importer</button></div></div>
      <div id="accList"></div>
      <input type="file" id="accFile" accept=".json,application/json" hidden>
    </div>
  </div>
  <footer>Heavily made with Claude</footer>
</div>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="dhead"><b id="dTitle">Thèmes</b><button class="x" id="dClose" type="button" aria-label="Fermer">✕</button></div>
  <div style="display:flex;gap:8px;padding:0 14px 8px"><input id="tq" type="text" autocomplete="off"><button id="rnd" class="pill" type="button">🎲</button></div>
  <div id="themeList"></div>
</aside>

const rc=x=>[...x].map(c=>Math.random()<.5?c.toLowerCase():c.toUpperCase()).join("");
function ligne(types,n,f,s){
  const t=types[Math.floor(Math.random()*types.length)];
  let out=t==="majuscule"?pick(MAJ):pick(LETTRES);
  for(let i=0;i<n-1;i++){
    if(t==="chiffre"&&i===0)out+=pick(CHIFFRES);
    else if(t==="tiret"&&i===0)out+="-";
    else out+=pick(LETTRES);
  }
  if(f)out=rc(f)+out.slice(f.length);
  if(s)out=out.slice(0,n-s.length)+rc(s);
  return out;
}
function toast(m){$("toast").textContent=m;setTimeout(()=>{$("toast").textContent=""},3500)}

$("gen").onclick=async()=>{
  if(busy)return;
  const types=[...document.querySelectorAll("#types input:checked")].map(i=>i.value);
  if(!types.length){toast(t("none"));return}
  const nb=Math.min(Math.max(+$("nb").value||1,1),1000000);
  const n=Math.min(Math.max(+$("len").value||5,2),64);
  const f=($("first").value||"").replace(/[^a-zA-Z]/g,"").slice(0,n);
  const s=($("last").value||"").replace(/[^a-zA-Z0-9]/g,"").slice(0,n-f.length);
  const uniq=$("nodup").checked,out=[],seen=uniq?new Set():null,cap=nb*30+1000;
  let tries=0;
  busy=true;$("gen").disabled=$("dl").disabled=$("cp").disabled=true;
  $("bar").style.display="block";$("barI").style.width="0";
  while(out.length<nb&&tries<cap){
    const stop=Math.min(tries+20000,cap);
    for(;tries<stop&&out.length<nb;tries++){const l=ligne(types,n,f,s);if(seen){if(seen.has(l))continue;seen.add(l)}out.push(l)}
    $("barI").style.width=(out.length/nb*100)+"%";
    await new Promise(r=>setTimeout(r));
  }
  lignesAll=out;contenu=out.join("\n")+"\n";
  renderPreview();
  nbLignes=out.length;octets=out.length*(n+1);showSize();
  $("bar").style.display="none";busy=false;$("gen").disabled=false;$("dl").disabled=$("cp").disabled=!out.length;
  toast(out.length<nb?t("uniq").replace("{n}",out.length.toLocaleString(t("loc"))):t("ok"));
};

const KEY="set5l",FIELDS=["nb","len","nom","fmt","first","last"];
function saveSet(){try{const o={lang};FIELDS.forEach(k=>o[k]=$(k).value);o.nodup=$("nodup").checked;o.types=[...document.querySelectorAll("#types input")].map(i=>i.checked);localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function loadSet(){try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(!o)return null;FIELDS.forEach(k=>{if(o[k]!=null){$(k).value=o[k];if($(k).tagName==="SELECT"&&$(k).value==="")$(k).selectedIndex=0}});$("nodup").checked=!!o.nodup;if(Array.isArray(o.types))document.querySelectorAll("#types input").forEach((c,i)=>{if(i<o.types.length)c.checked=!!o.types[i]});return o}catch(e){return null}}
document.querySelector(".wrap").addEventListener("input",saveSet);
document.querySelector(".wrap").addEventListener("change",saveSet);
$("fmt").addEventListener("change",()=>{$("nom").value=$("nom").value.replace(/\.(txt|csv|json)$/i,"")+"."+$("fmt").value});
const lineHTML=l=>{const on=favs.includes(l);return `<div class="ln"><span data-c="${l}">${l}</span><button type="button" data-f="${l}" class="${on?"on":""}" aria-label="★">${on?"★":"☆"}</button></div>`};
function renderPreview(){$("apercu").innerHTML=lignesAll.slice(0,200).map(lineHTML).join("")+(lignesAll.length>200?'<div class="empty">…</div>':"")}
function renderFavs(){$("favNote").textContent=storeOK?"":t("nostore");$("favT").textContent=t("fav")+" ("+favs.length+")";$("favs").innerHTML=favs.length?favs.map(lineHTML).join(""):`<span class="empty">${t("favempty")}</span>`}
function syncStars(){document.querySelectorAll("#apercu [data-f]").forEach(b=>{const on=favs.includes(b.dataset.f);b.textContent=on?"★":"☆";b.classList.toggle("on",on)})}
function saveFavs(){try{localStorage.setItem("fav5l",JSON.stringify(favs))}catch(e){}renderFavs();syncStars()}
function lineClick(e){
  const c=e.target.closest("[data-c]"),f=e.target.closest("[data-f]");
  if(c){navigator.clipboard.writeText(c.dataset.c).then(()=>toast(t("cpl")),()=>toast(t("cpfail")))}
  else if(f){const v=f.dataset.f,i=favs.indexOf(v);if(i<0)favs.push(v);else favs.splice(i,1);saveFavs()}
}
$("apercu").onclick=$("favs").onclick=lineClick;
$("favCp").onclick=()=>{if(favs.length)navigator.clipboard.writeText(favs.join("\n")).then(()=>toast(t("cpok")),()=>toast(t("cpfail")))};
$("favClr").onclick=()=>{favs=[];saveFavs()};
function exportData(fm){return fm==="json"?JSON.stringify(lignesAll):fm==="csv"?"pseudo\n"+contenu:contenu}
const storeOK=(()=>{try{localStorage.setItem("t5l","1");localStorage.removeItem("t5l");return true}catch(e){return false}})();
async function saveFile(nom,dat,mime){
  let d=null;
  try{d=(typeof claude!=="undefined"&&claude.use)?await claude.use("downloads"):null}catch(e){d=null}
  if(d){try{await d.save({filename:nom,data:dat});return}catch(e){if(e&&e.code==="declined")return}}
  const u=URL.createObjectURL(new Blob([dat],{type:mime+";charset=utf-8"}));
  const a=document.createElement("a");a.href=u;a.download=nom;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
$("favExp").onclick=()=>{if(favs.length)saveFile("favoris.txt",favs.join("\n")+"\n","text/plain")};
$("favImp").onclick=()=>$("favFile").click();
$("favFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const tx=await f.text();tx.split(/\r?\n/).map(x=>x.trim()).filter(x=>/^[A-Za-z0-9-]{1,64}$/.test(x)&&!favs.includes(x)).forEach(x=>favs.push(x));saveFavs()}catch(err){}e.target.value=""};
let accs=[];
try{const a=JSON.parse(localStorage.getItem("acc5l")||"[]");if(Array.isArray(a))accs=a.filter(x=>x&&typeof x==="object").map(x=>({p:String(x.p||"").slice(0,200),e:String(x.e||"").slice(0,200),w:String(x.w||"").slice(0,200)}))}catch(e){}
const saveAcc=()=>{try{localStorage.setItem("acc5l",JSON.stringify(accs))}catch(e){}};
function mk(tag,txt,cls){const n=document.createElement(tag);if(txt!=null)n.textContent=txt;if(cls)n.className=cls;return n}
function cpText(v){navigator.clipboard.writeText(v).then(()=>toast(t("cpl")),()=>toast(t("cpfail")))}
function renderAcc(){
  const box=$("accList");box.textContent="";
  if(!accs.length){box.append(mk("span",t("accEmpty"),"empty"));return}
  accs.forEach((a,i)=>{
    const card=mk("div",null,"acc");
    [["accP",a.p,false],["accE",a.e,false],["accW",a.w,true]].forEach(([k,v,secret])=>{
      const row=mk("div",null,"f"),val=mk("span",secret&&v?"••••••••":(v||"—"));
      row.append(mk("small",t(k)),val);
      if(secret&&v){const eye=mk("button","👁","mini");eye.type="button";eye.setAttribute("aria-label",t("show"));eye.onclick=()=>{val.textContent=val.textContent===v?"••••••••":v};row.append(eye)}
      if(v){const c=mk("button","📋","mini");c.type="button";c.setAttribute("aria-label",t("cp"));c.onclick=()=>cpText(v);row.append(c)}
      card.append(row)});
    const del=mk("button",t("accDel"),"mini del");del.type="button";
    del.onclick=()=>{if(del.dataset.s){accs.splice(i,1);saveAcc();renderAcc()}else{del.dataset.s="1";del.textContent=t("accSure")}};
    card.append(del);box.append(card)});
}
$("accAdd").onclick=()=>{
  const p=$("ap").value.trim(),e=$("ae").value.trim(),w=$("aw").value;
  if(!p&&!e&&!w){toast(t("accNone"));return}
  accs.unshift({p,e,w});saveAcc();renderAcc();["ap","ae","aw"].forEach(k=>$(k).value="");toast(t("accSaved"));
};
$("awEye").onclick=()=>{$("aw").type=$("aw").type==="password"?"text":"password"};
$("accExp").onclick=()=>{if(accs.length)saveFile("comptes.json",JSON.stringify(accs,null,2),"application/json")};
$("accImp").onclick=()=>$("accFile").click();
$("accFile").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const a=JSON.parse(await f.text());if(Array.isArray(a))a.filter(x=>x&&typeof x==="object").map(x=>({p:String(x.p||"").slice(0,200),e:String(x.e||"").slice(0,200),w:String(x.w||"").slice(0,200)})).forEach(x=>{if(!accs.some(y=>y.p===x.p&&y.e===x.e&&y.w===x.w))accs.push(x)});saveAcc();renderAcc()}catch(err){}ev.target.value=""};
function showTab(k){const g=k==="gen";$("tabGen").hidden=!g;$("tabAcc").hidden=g;$("tbGen").classList.toggle("on",g);$("tbAcc").classList.toggle("on",!g);$("tbGen").setAttribute("aria-selected",String(g));$("tbAcc").setAttribute("aria-selected",String(!g))}
$("tbGen").onclick=()=>showTab("gen");$("tbAcc").onclick=()=>showTab("acc");
function sfx(){try{const a=new Audio(MEOW);a.volume=.8;const r=a.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
$("dl").onclick=async()=>{
  sfx();
  try{
    const fm=$("fmt").value,nom=$("nom").value||("names."+fm),dat=exportData(fm);
    let d=null;
    try{d=(typeof claude!=="undefined"&&claude.use)?await claude.use("downloads"):null}catch(e){d=null}
    if(d){
      try{await d.save({filename:nom,data:dat});return}
      catch(e){if(e&&e.code==="declined"){toast(t("dlfail"));return}}
    }
    const u=URL.createObjectURL(new Blob([dat],{type:(fm==="json"?"application/json":fm==="csv"?"text/csv":"text/plain")+";charset=utf-8"}));
    const a=document.createElement("a");a.href=u;a.download=nom;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){toast(t("dlfail"))}
};
$("cp").onclick=async()=>{
  try{await navigator.clipboard.writeText(contenu);toast(t("cpok"))}
  catch(e){toast(t("cpfail"))}
};

l:grad:240:290:1:1;Coral Reef:grad:10:180:0:1;Toxic Waste:grad:105:280:1:1;Dusk Rose:grad:330:250:1:1;Sandstorm:grad:38:20:0:1;Moonlight:grad:230:200:1:1";
GEN.split(";").forEach((s,i)=>{
  const [n,g,a,b,d,r]=s.split(":"),h1=+a,h2=+b,dk=d==="1",L=dk?62:44,S=dk?80:78;
  const vars={...N(h1,dk,dk?30:60),"--accent":`hsl(${h1} ${S}% ${L}%)`,"--accent2":`hsl(${h2} ${S}% ${L+2}%)`,"--accent3":`hsl(${(h2+30)%360} ${S}% ${L+4}%)`,"--onacc":dk?"#0b0b14":"#fff"};
  if(r==="1")vars["--bgimg"]=dk?`linear-gradient(135deg,hsl(${h1} 50% 11%),hsl(${h2} 50% 8%))`:`linear-gradient(135deg,hsl(${h1} 90% 94%),hsl(${h2} 90% 92%))`;
  THEMES.push({id:"g"+i,g,name:n,dark:dk,vars});
});
const TH_ORDER=["violet","green","teal","blue","pink","red","orange","yellow","white","black","mix","grad"];
const VARS=["--bg","--card","--text","--muted","--line","--code","--accent","--accent2","--accent3","--onacc","--bgimg"];
let themeId="auto";
const swOf=th=>th.vars?{bg:th.vars["--bgimg"]||th.vars["--bg"],a:th.vars["--accent"],c:th.vars["--accent3"]}:th.sw;
function renderThemes(){
  let h="";
  TH_ORDER.forEach(g=>{
    const q=($("tq").value||"").toLowerCase(),list=THEMES.filter(x=>x.g===g&&(!q||x.name.toLowerCase().includes(q)));
    if(!list.length)return;
    h+=`<div class="grp">${t("g_"+g)}</div>`;
    list.forEach(th=>{const s=swOf(th);h+=`<button type="button" class="opt${th.id===themeId?" on":""}" data-id="${th.id}"><span class="sw" style="background:${s.bg}"><i style="background:linear-gradient(135deg,${s.a},${s.c})"></i></span>${th.name}</button>`});
  });
  $("themeList").innerHTML=h;
}
function setTheme(id,save){
  const th=THEMES.find(x=>x.id===id)||THEMES[0],r=document.documentElement;
  VARS.forEach(v=>r.style.removeProperty(v));
  r.style.colorScheme="";
  if(th.vars){for(const k in th.vars)r.style.setProperty(k,th.vars[k]);r.style.colorScheme=th.dark?"dark":"light"}
  themeId=th.id;
  if(save){try{localStorage.setItem("theme5l",th.id)}catch(e){}}
  renderThemes();
}
function drawer(on){
  $("drawer").classList.toggle("on",on);$("ov").classList.toggle("on",on);
  $("drawer").setAttribute("aria-hidden",String(!on));
}
$("themeBtn").onclick=()=>{drawer(true);setTimeout(()=>$("tq").focus(),60)};
$("tq").oninput=renderThemes;
$("rnd").onclick=()=>setTheme(THEMES[Math.floor(Math.random()*THEMES.length)].id,true);
$("dClose").onclick=$("ov").onclick=()=>drawer(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")drawer(false)});
$("themeList").onclick=e=>{const b=e.target.closest(".opt");if(b)setTheme(b.dataset.id,true)};

$("lang").onchange=e=>{lang=e.target.value;applyLang()};
try{const s=localStorage.getItem("theme5l");if(s)themeId=s}catch(e){}
setTheme(themeId,false);
const DISPO=["fr","en","es","de","it","ja","ko","ru","pl","uk","pt","ar"];
const prefs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]).map(l=>String(l).toLowerCase().slice(0,2));
try{favs=JSON.parse(localStorage.getItem("fav5l")||"[]").filter(x=>/^[A-Za-z0-9-]{1,64}$/.test(x))}catch(e){favs=[]}
const sv=loadSet();
lang=(sv&&DISPO.includes(sv.lang))?sv.lang:(prefs.find(l=>DISPO.includes(l))||"en");
$("lang").value=lang;
applyLang();
</script>
